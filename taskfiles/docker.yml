# The console tasks in the toolchain image (docker/Dockerfile), through scripts/docker.sh.
version: '3'

tasks:
  build:
    desc: Build the toolchain image (tag NX_IMAGE in scripts/pins.env)
    cmds:
      - . scripts/pins.env && docker build -t "$NX_IMAGE" - < docker/Dockerfile

  cross-check:
    desc: Type-check the probe for the console
    deps: [build]
    cmds:
      - bash scripts/docker.sh scripts/cargo-nx.sh check -p pf-nx-probe {{.CLI_ARGS}}

  probe:
    desc: 'The probe NRO in dist/ with checks 1-3 (`task nvk:probe` adds check 4)'
    deps: [build]
    cmds:
      - bash scripts/docker.sh bash -c 'scripts/cargo-nx.sh build -p pf-nx-probe && scripts/package-nro.sh pf-nx-probe'
