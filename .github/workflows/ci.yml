# Every push and PR: the host lane tests the workspace on Linux; the console lane builds the
# toolchain image and the probe NRO, which every run uploads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libfreetype-dev libfontconfig1-dev mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: . scripts/pins.env && docker build -t "$NX_IMAGE" - < docker/Dockerfile
      # Until plan §7's monorepo PRs land: the pinned shared crates with docs/monorepo-horizon.diff
      # applied, in the toolchain volume where scripts/cargo-nx.sh patches them in.
      - name: Shared crates
        run: |
          . scripts/pins.env
          git init -q mono
          git -C mono fetch -q --depth 1 https://git.unom.io/unom/punktfunk "$PUNKTFUNK_REV" ||
            git -C mono fetch -q https://git.unom.io/unom/punktfunk
          git -C mono checkout -q "$PUNKTFUNK_REV"
          patch -d mono -p1 < docs/monorepo-horizon.diff
          tar -cf - -C mono --exclude=.git . |
            docker run --rm -i -v pf-nx-toolchains:/opt/pf-nx alpine:3 sh -c \
              'rm -rf /opt/pf-nx/mono && mkdir -p /opt/pf-nx/mono && tar -xf - -C /opt/pf-nx/mono'
      - name: Probe
        run: scripts/docker.sh bash -c 'scripts/cargo-nx.sh build -p pf-nx-probe && scripts/package-nro.sh pf-nx-probe'
      - uses: actions/upload-artifact@v4
        with:
          name: pf-nx-probe
          path: dist/pf-nx-probe.nro
