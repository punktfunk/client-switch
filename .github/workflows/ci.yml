# Every push and PR: the host lane tests the workspace on Linux; the console lane builds the
# toolchain image and the probe NRO, which every run uploads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libfreetype-dev libfontconfig1-dev mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The image's layers live in the Actions cache: devkitPro's servers are hit only when a pin
      # or the Dockerfile changes, not on every run (they answered 403 to repeated runs).
      - name: Pins
        id: pins
        run: grep -E '^[A-Z0-9_]+=' scripts/pins.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: ${{ steps.pins.outputs.NX_IMAGE }}
          build-args: |
            DEVKITA64=${{ steps.pins.outputs.DEVKITA64 }}
            LIBNX=${{ steps.pins.outputs.LIBNX }}
            SWITCH_TOOLS=${{ steps.pins.outputs.SWITCH_TOOLS }}
            RUST_NIGHTLY=${{ steps.pins.outputs.RUST_NIGHTLY }}
          cache-from: type=gha,scope=nx-toolchain
          cache-to: type=gha,scope=nx-toolchain,mode=max
      - name: Probe
        run: scripts/docker.sh bash -c 'scripts/cargo-nx.sh build -p pf-nx-probe && scripts/package-nro.sh pf-nx-probe'
      - uses: actions/upload-artifact@v4
        with:
          name: pf-nx-probe
          path: |
            dist/pf-nx-probe.nro
            dist/pf-nx-probe.elf
