# Every push and PR: the host lane tests the workspace on Linux; the console lane
# (console.yml) builds the probe NRO and the title's (punktfunk.nro), which every run uploads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libfreetype-dev libfontconfig1-dev mesa-vulkan-drivers libvulkan1 libavcodec-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  console:
    uses: ./.github/workflows/console.yml
