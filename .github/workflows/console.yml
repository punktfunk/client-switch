# The console lane: the toolchain image, NVK and Skia (each cached per pin), the probe NRO and the
# title's (punktfunk.nro), uploaded as artifacts. ci.yml runs it on every push and PR, release.yml
# on a version tag with the tag's version.
name: console

on:
  workflow_call:
    inputs:
      version:
        description: PKG_VERSION for the title; empty derives it from git (scripts/docker.sh)
        type: string
        default: ''
      ref:
        description: the commit to build; empty builds the PR's head or the pushed commit
        type: string
        default: ''

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  console:
    runs-on: ubuntu-24.04
    steps:
      # The branch's own commit, not the PR's merge commit, so the NRO's version names a commit
      # that exists (scripts/docker.sh).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      # The runner's preinstalled SDKs the console build never uses: about 25 GB back.
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The image's layers live in the Actions cache: devkitPro's servers are hit only when a pin
      # or the Dockerfile changes, not on every run (they answered 403 to repeated runs).
      - name: Pins
        id: pins
        run: grep -E '^[A-Z0-9_]+=' scripts/pins.env >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: ${{ steps.pins.outputs.NX_IMAGE }}
          build-args: |
            DEVKITA64=${{ steps.pins.outputs.DEVKITA64 }}
            LIBNX=${{ steps.pins.outputs.LIBNX }}
            SWITCH_TOOLS=${{ steps.pins.outputs.SWITCH_TOOLS }}
            SWITCH_FFMPEG=${{ steps.pins.outputs.SWITCH_FFMPEG }}
            SWITCH_DAV1D=${{ steps.pins.outputs.SWITCH_DAV1D }}
            RUST_NIGHTLY=${{ steps.pins.outputs.RUST_NIGHTLY }}
          cache-from: type=gha,scope=nx-toolchain
          cache-to: type=gha,scope=nx-toolchain,mode=max
      # NVK (libvulkan_bh.a) for check 4: built once per pin, then kept in the Actions cache and
      # loaded into the toolchain volume where pf-nx-sys links it.
      # Saved right after the build, not at the job's end, so a later failing step keeps it.
      - name: NVK cache
        id: nvk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nvk-archive
          key: nvk-${{ hashFiles('scripts/build-nvk.sh', 'scripts/pins.env') }}
      - name: NVK
        if: steps.nvk.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc) PF_NX_NVK_WORK="$RUNNER_TEMP/nvk" scripts/build-nvk.sh
          mkdir -p "$RUNNER_TEMP/nvk-archive"
          docker run --rm -v pf-nx-toolchains:/opt/pf-nx alpine:3 tar -cf - -C /opt/pf-nx/nvk . |
            tar -xf - -C "$RUNNER_TEMP/nvk-archive"
          # Mesa's tree and the two NVK images fill the runner's disk before the probe's build.
          sudo rm -rf "$RUNNER_TEMP/nvk"
          docker image rm -f bevy-horizon-nvk:local bevy-horizon-toolchain:local
          docker builder prune -af
          df -h /
      - name: NVK cache save
        if: steps.nvk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nvk-archive
          key: ${{ steps.nvk.outputs.cache-primary-key }}
      - name: NVK into the volume
        if: steps.nvk.outputs.cache-hit == 'true'
        run: |
          tar -cf - -C "$RUNNER_TEMP/nvk-archive" . | docker run --rm -i -v pf-nx-toolchains:/opt/pf-nx alpine:3 sh -c \
            'rm -rf /opt/pf-nx/nvk && mkdir -p /opt/pf-nx/nvk && tar -xf - -C /opt/pf-nx/nvk'
      # Skia's Vulkan archive for the title, the same way: built once per skia-bindings version
      # and per change to how it is built, then kept in the Actions cache.
      - name: Skia key
        id: skia-key
        run: echo "version=$(grep -A1 '^name = "skia-bindings"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Skia cache
        id: skia
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/skia-archive
          key: skia-vulkan-${{ steps.skia-key.outputs.version }}-${{ hashFiles('scripts/build-skia.sh', 'toolchain/skia/**', 'scripts/pins.env') }}
      - name: Skia
        if: steps.skia.outputs.cache-hit != 'true'
        run: |
          scripts/docker.sh scripts/build-skia.sh vulkan
          mkdir -p "$RUNNER_TEMP/skia-archive"
          docker run --rm -v pf-nx-toolchains:/opt/pf-nx alpine:3 tar -cf - -C /opt/pf-nx/skia . |
            tar -xf - -C "$RUNNER_TEMP/skia-archive"
          # Skia's tree and objects, which the title's build has no use for.
          docker run --rm -v pf-nx-target:/t alpine:3 rm -rf /t/skia
          df -h /
      - name: Skia cache save
        if: steps.skia.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/skia-archive
          key: ${{ steps.skia.outputs.cache-primary-key }}
      - name: Skia into the volume
        if: steps.skia.outputs.cache-hit == 'true'
        run: |
          tar -cf - -C "$RUNNER_TEMP/skia-archive" . | docker run --rm -i -v pf-nx-toolchains:/opt/pf-nx alpine:3 sh -c \
            'rm -rf /opt/pf-nx/skia && mkdir -p /opt/pf-nx/skia && tar -xf - -C /opt/pf-nx/skia'
      - name: Probe
        run: scripts/docker.sh bash -c 'scripts/cargo-nx.sh build -p pf-nx-probe --features vulkan,nvdec && scripts/package-nro.sh pf-nx-probe'
      - name: Title
        env:
          PKG_VERSION: ${{ inputs.version }}
        run: scripts/docker.sh bash -c 'scripts/cargo-nx.sh build -p pf-nx && scripts/package-nro.sh pf-nx punktfunk Punktfunk'
      # Check 6 reads these from the SD card next to the NRO.
      - name: NVDEC streams
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && scripts/nvdec-streams.sh
      - uses: actions/upload-artifact@v4
        # A storage quota must not red the build; the title is proven by the link above.
        continue-on-error: true
        with:
          name: pf-nx-probe
          path: |
            dist/pf-nx-probe.nro
            dist/pf-nx-probe.elf
            dist/nvdec-*
      - uses: actions/upload-artifact@v4
        # A storage quota must not red the build; the title is proven by the link above.
        continue-on-error: true
        with:
          name: punktfunk
          path: |
            dist/punktfunk.nro
            dist/punktfunk.elf
            dist/THIRD-PARTY-NOTICES.txt
