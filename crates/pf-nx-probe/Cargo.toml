[package]
name = "pf-nx-probe"
description = "WP0's probe: numbered checks of what std, the sockets and punktfunk-core's QUIC plane need from the console."
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pf-nx-probe"
path = "src/main.rs"

[features]
default = ["quic"]
# Check 3: punktfunk-core's QUIC plane on tokio. Without it the NRO carries checks 1 and 2.
quic = ["dep:punktfunk-core", "dep:tokio"]

[dependencies]
libc = "0.2"
punktfunk-core = { workspace = true, optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

# libnx through the one FFI crate, without libavcodec or NVK: the probe links neither.
[target.'cfg(target_os = "horizon")'.dependencies]
pf-nx-sys = { path = "../pf-nx-sys", default-features = false }

[lints]
workspace = true
