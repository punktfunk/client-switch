[package]
name = "pf-nx"
description = "Nintendo Switch homebrew client for punktfunk: the title binary."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pf-nx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
pf-nx-app = { path = "crates/pf-nx-app" }

[target.'cfg(target_os = "horizon")'.dependencies]
pf-nx-platform = { path = "crates/pf-nx-platform" }
# For `rt::link_guard`, which keeps the runtime shims in the title's link.
pf-nx-sys = { path = "crates/pf-nx-sys" }

[target.'cfg(not(target_os = "horizon"))'.dependencies]
pf-nx-host = { path = "crates/pf-nx-host" }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/pf-nx-sys",
    "crates/pf-nx-vk",
    "crates/pf-nx-platform",
    "crates/pf-nx-host",
    "crates/pf-nx-app",
    "crates/pf-nx-probe",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/punktfunk/client-switch"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
# Same Skia as the shared console; the console build adds the Vulkan backend (pf-nx-vk).
skia-safe = { version = "0.153", features = ["textlayout"] }
# One REV for all shared crates: a tag and a rev build two copies whose types don't unify.
# At least the merge of monorepo #2180, which carries the Horizon cfgs this client builds on.
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", rev = "b58dc3cfe152c48c584c8e2f77dc05d08f6aeb12", features = ["quic"] }
pf-client-core = { git = "https://git.unom.io/unom/punktfunk", rev = "b58dc3cfe152c48c584c8e2f77dc05d08f6aeb12", default-features = false }
pf-console-ui = { git = "https://git.unom.io/unom/punktfunk", rev = "b58dc3cfe152c48c584c8e2f77dc05d08f6aeb12", default-features = false }
# The parts this crate reads itself. The host's sentences come worded from the core.
pf-l10n = { git = "https://git.unom.io/unom/punktfunk", rev = "b58dc3cfe152c48c584c8e2f77dc05d08f6aeb12", default-features = false, features = ["client", "console", "host"] }
# No `pyrowave` here: pf-nx-vk's own feature turns the lane on (plan D14), so a default build
# compiles none of the wavelet decoder for the console.
pf-client-video = { git = "https://git.unom.io/unom/punktfunk", rev = "b58dc3cfe152c48c584c8e2f77dc05d08f6aeb12", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
cast_lossless = "warn"
map_unwrap_or = "warn"
use_self = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
format_collect = "warn"
suspicious_operation_groupings = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
# Fat LTO inlines core's hot paths (AEAD, FEC, QUIC parsing) across crates.
lto = "fat"
codegen-units = 1
# No unwinding across the C boundaries; the panic hook writes the log first.
panic = "abort"
debug = "line-tables-only"
